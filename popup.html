<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Estimates</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="context-bar">
    <div class="board-name" id="board-name">…</div>
    <div class="card-name" id="card-name">…</div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="stats">
    <div class="stat-tile">
      <div class="label">Celkový odhad</div>
      <div class="value" id="stat-total">0 h</div>
    </div>
    <div class="stat-tile">
      <div class="label">Návrhy nalezeny</div>
      <div class="value" id="stat-count">–</div>
    </div>
    <div class="stat-tile">
      <div class="label">Nejnovější záznam</div>
      <div class="value" id="stat-latest">–</div>
    </div>
  </div>

  <div class="columns">
    <div class="col panel">
      <h3>Odhad</h3>
      <div id="estimate-rows"></div>
      <button class="add-row" id="add-row">+ přidat řádek</button>
      <div class="total-line">Celkem: <span class="n" id="total-line-value">0</span> h</div>
      <div class="actions">
        <button class="primary" id="save-btn">Uložit odhad</button>
        <span class="saved-hint" id="saved-hint" style="display:none;">Uloženo ✓</span>
      </div>
    </div>
    <div class="col panel">
      <h3>Reálně natrackovaný čas (návrhy)</h3>
      <div id="suggestions">
        <div class="empty-hint">Načítám…</div>
      </div>
    </div>
  </div>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
